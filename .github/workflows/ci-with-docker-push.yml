# Extended CI/CD Pipeline — builds, tests, and pushes Docker image to Docker Hub
# Requires GitHub secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# Set these at: GitHub repo → Settings → Secrets and variables → Actions

name: ML CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./lab2-ml-api
          file: ./lab2-ml-api/Dockerfile
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-classifier:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-classifier:${{ github.sha }}

