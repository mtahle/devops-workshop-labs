# GitHub Actions CI Pipeline for ML Projects
# Copy this file to .github/workflows/ci.yml in your project

name: ML CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lab2-ml-api/requirements.txt

      - name: Train model
        run: python lab2-ml-api/model.py

      - name: Run tests
        run: pytest lab2-ml-api/tests/ -v

      - name: Build Docker image
        run: docker build -t iris-classifier:${{ github.sha }} ./lab2-ml-api

      - name: Verify container starts
        run: |
          docker run -d -p 8000:8000 --name test-container iris-classifier:${{ github.sha }}
          HEALTH_OK=0
          for i in $(seq 1 15); do
            echo "Health check attempt $i/15"
            if [ "$(docker inspect -f '{{.State.Running}}' test-container)" != "true" ]; then
              echo "Container exited before health check completed"
              docker logs test-container || true
              exit 1
            fi
            if curl -fsS http://localhost:8000/ > /dev/null; then
              echo "Container health check passed"
              HEALTH_OK=1
              break
            fi
            sleep 2
          done
          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "Container did not become healthy in time"
            echo "Last curl response/error output:"
            curl -sS http://localhost:8000/ || true
            docker logs test-container || true
            exit 1
          fi
          docker logs test-container || true
          docker stop test-container

